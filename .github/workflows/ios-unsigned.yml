name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-unsigned.yml'

permissions:
  contents: write

jobs:
  build-ios-unsigned:
    runs-on: macos-15
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Upgrade expo-modules-jsi (upstream Swift 6.2 fix in 57.0.8)
        run: npm install --no-save expo-modules-jsi@57.0.8

      - name: Patch expo-modules-jsi header for Xcode 26 clang
        run: |
          H="node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h"
          # 57.0.8 annotates C++ constructors with SWIFT_RETURNS_RETAINED, which
          # Xcode 26's clang rejects. Strip the annotation (restores 57.0.4 behavior).
          sed -i '' 's/SWIFT_RETURNS_RETAINED RuntimeScheduler(/RuntimeScheduler(/' "$H"
          grep -n "SWIFT_RETURNS_RETAINED" "$H" || echo "header patched clean"

      - name: Patch ExpoModulesJSI for Swift 6.2 (upstream UncheckedSendable fix)
        run: |
          python3 - <<'EOF'
          p = "node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/JavaScriptRuntime.swift"
          src = open(p).read()

          # 1. Add the UncheckedSendable wrapper before the first createFunctionClosure
          wrapper = (
            "/// Unchecked Sendable wrapper for call-scoped raw pointers captured by\n"
            "/// synchronously-executed closures. Mirrors the upstream fix for the\n"
            "/// Swift 6.2 compiler, which rejects `nonisolated(unsafe)` captures in\n"
            "/// global-actor-isolated closures.\n"
            "private struct UncheckedSendable<T>: @unchecked Sendable {\n"
            "  let value: T\n"
            "  init(_ value: T) { self.value = value }\n"
            "}\n"
            "\n"
          )
          assert "struct UncheckedSendable" not in src
          src = src.replace("private func createFunctionClosure(", wrapper + "private func createFunctionClosure(", 1)

          # 2. Swap nonisolated(unsafe) captures for UncheckedSendable (both overloads)
          old_lets = "\n".join([
            "    nonisolated(unsafe) let thisPtr = thisPtr",
            "    nonisolated(unsafe) let argumentsPtr = argumentsPtr",
            "    nonisolated(unsafe) let resultPtr = resultPtr",
          ])
          new_lets = "\n".join([
            "    let thisPtr = UncheckedSendable(thisPtr)",
            "    let argumentsPtr = UncheckedSendable(argumentsPtr)",
            "    let resultPtr = UncheckedSendable(resultPtr)",
          ])
          n = src.count(old_lets)
          assert n == 2, f"expected 2 capture blocks, found {n}"
          src = src.replace(old_lets, new_lets)

          # 3. Update use sites to go through .value
          # (leading \n anchors the 6-space indent: the 8-space HostObjectContext
          # site must stay untouched)
          reps = [
            ("\n      resultPtr.pointee = JavaScriptActor.assumeIsolated {", "\n      resultPtr.value.pointee = JavaScriptActor.assumeIsolated {"),
            ("UnsafeMutablePointer(mutating: thisPtr).move()", "UnsafeMutablePointer(mutating: thisPtr.value).move()"),
            ("start: argumentsPtr, count:", "start: argumentsPtr.value, count:"),
            ("JavaScriptUnownedValue(runtime.pointee, thisPtr)", "JavaScriptUnownedValue(runtime.pointee, thisPtr.value)"),
          ]
          for old, new in reps:
            c = src.count(old)
            assert c >= 1, f"pattern not found: {old}"
            src = src.replace(old, new)

          open(p, "w").write(src)
          print("patched OK")
          EOF

      - name: Patch JavaScriptActor for dyld (v21 delete throwing assumeIsolated)
        run: |
          python3 - <<'EOF'
          p = "node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/JavaScriptActor.swift"
          src = open(p).read()

          # v21: the throwing assumeIsolated overload cannot be referenced
          # cross-module under Swift 6.2 (dyld "Symbol not found" at launch).
          # v20 bypassed it at all 7 expo-modules-core call sites, yet the
          # binary still emitted the old typed-throws mangling — the reference
          # source is not in any text call site. Delete the overload entirely:
          # it can never be referenced again, and any straggler becomes a
          # compile error with file/line instead of a launch crash.
          old = (
            "  /// Throwing counterpart to the nonthrowing overload above. The generic error type keeps\n"
            "  /// `operation` nonescaping while preserving the exact error it can throw.\n"
            "  @_alwaysEmitIntoClient\n"
            "  @inline(__always)\n"
            "  public static func assumeIsolated<T: ~Copyable, E: Error>(\n"
            "    _ operation: @JavaScriptActor () throws(E) -> T\n"
            "  ) throws(E) -> T {\n"
            "    // Casting a `throws(E)` function value requires newer OS runtime support. Wrapping the\n"
            "    // operation in the nonthrowing fast path keeps this backdeployable and stack-allocated.\n"
            "    let result: Result<T, E> = assumeIsolated {\n"
            "      return Result(catching: operation)\n"
            "    }\n"
            "    return try result.get()\n"
            "  }\n"
          )
          # v21: delete the throwing overload entirely (see comment above).
          new = ""
          assert src.count(old) == 1, "throwing assumeIsolated pattern not found"
          src = src.replace(old, new)
          open(p, "w").write(src)
          print("throwing assumeIsolated overload deleted (v21)")
          EOF

      - name: Patch expo-modules-core call sites (v20 bypass throwing assumeIsolated)
        run: |
          python3 - <<'EOF'
          # v20: the throwing JavaScriptActor.assumeIsolated overload cannot be
          # referenced cross-module under Swift 6.2 (dyld "Symbol not found" at
          # launch — the client mangles a different symbol than the library
          # emits, and @_alwaysEmitIntoClient fails to inline it away; builds
          # 10-19 all verified broken). Bypass it at all 7 throwing call sites
          # in expo-modules-core by capturing the thrown error in Result, so
          # only the non-throwing overload (which links fine) is referenced
          # cross-module. Semantics are unchanged: the same error value is
          # rethrown to the caller.

          def patch(path, old, new, count=1):
              src = open(path).read()
              found = src.count(old)
              assert found == count, f"{path}: expected {count}, found {found}"
              open(path, "w").write(src.replace(old, new))
              print(f"OK {path}")

          CORE = "node_modules/expo-modules-core/ios"

          # 1. JSValueDecoder.swift — decodeUsingDynamicType
          patch(f"{CORE}/Core/JSValueDecoder.swift",
          """      let anyValue = try JavaScriptActor.assumeIsolated {
                  return try dynamicType.cast(jsValue: jsValue, appContext: appContext)
                }
          """,
          """      // v20: bypass the throwing assumeIsolated overload (Swift 6.2 dyld
                // symbol mismatch). Result captures the error so only the non-throwing
                // overload is referenced cross-module; the same error is rethrown.
                let isolatedResult: Result<Any, any Error> = JavaScriptActor.assumeIsolated {
                  Result {
                    return try dynamicType.cast(jsValue: jsValue, appContext: appContext)
                  }
                }
                let anyValue = try isolatedResult.get()
          """)

          # 2. AppContext.swift — newObject(nativeClassId:)
          patch(f"{CORE}/Core/AppContext.swift",
          """    return try JavaScriptActor.assumeIsolated {
                let prototype = try jsClass.getProperty("prototype").asObject()
                return try runtime.createObject(prototype: prototype)
              }
          """,
          """    // v20: bypass the throwing assumeIsolated overload (Swift 6.2 dyld
              // symbol mismatch). Result captures the error so only the non-throwing
              // overload is referenced cross-module; the same error is rethrown.
              let isolatedResult: Result<JavaScriptObject?, any Error> = JavaScriptActor.assumeIsolated {
                Result {
                  let prototype = try jsClass.getProperty("prototype").asObject()
                  return try runtime.createObject(prototype: prototype)
                }
              }
              return try isolatedResult.get()
          """)

          # 3. AppContext.swift — prepareUIRuntime() (multi-statement body)
          p = f"{CORE}/Core/AppContext.swift"
          lines = open(p).read().split("\n")
          starts = [i for i, l in enumerate(lines) if l == "    try JavaScriptActor.assumeIsolated {"]
          assert len(starts) == 1, f"prepareUIRuntime call site not unique: {starts}"
          start = starts[0]
          tails = [i for i in range(start, len(lines)) if lines[i] == "      try installModuleClasses(in: uiRuntime)"]
          assert len(tails) == 1, "prepareUIRuntime body tail not unique"
          tail = tails[0]
          assert lines[tail + 1] == "    }" and lines[tail + 2] == "  }", "prepareUIRuntime tail changed"
          lines[start] = (
              "    // v20: bypass the throwing assumeIsolated overload (Swift 6.2 dyld\n"
              "    // symbol mismatch). Result captures the error so only the non-throwing\n"
              "    // overload is referenced cross-module; the same error is rethrown.\n"
              "    let isolatedResult: Result<Void, any Error> = JavaScriptActor.assumeIsolated {\n"
              "      Result {"
          )
          lines.insert(tail + 1, "      }")          # closes Result
          lines.insert(tail + 3, "    try isolatedResult.get()")
          open(p, "w").write("\n".join(lines))
          print(f"OK {p} (prepareUIRuntime)")

          # 4. DynamicSharedObjectType.swift — getBaseSharedType
          patch(f"{CORE}/Core/DynamicTypes/DynamicSharedObjectType.swift",
          """  return try JavaScriptActor.assumeIsolated {
              return try isSharedRef ? appContext.runtime.getSharedRefClass() : appContext.runtime.getSharedObjectClass()
            }
          """,
          """  // v20: bypass the throwing assumeIsolated overload (Swift 6.2 dyld
            // symbol mismatch). Result captures the error so only the non-throwing
            // overload is referenced cross-module; the same error is rethrown.
            let isolatedResult: Result<JavaScriptFunction, any Error> = JavaScriptActor.assumeIsolated {
              Result {
                return try isSharedRef ? appContext.runtime.getSharedRefClass() : appContext.runtime.getSharedObjectClass()
              }
            }
            return try isolatedResult.get()
          """)

          # 5. DynamicRawType.swift — convertResult
          patch(f"{CORE}/Core/DynamicTypes/DynamicRawType.swift",
          """      return try JavaScriptActor.assumeIsolated {
                  return try objectBuilder.build(appContext: appContext).asValue()
                }
          """,
          """      // v20: bypass the throwing assumeIsolated overload (Swift 6.2 dyld
                // symbol mismatch). Result captures the error so only the non-throwing
                // overload is referenced cross-module; the same error is rethrown.
                let isolatedResult: Result<JavaScriptValue, any Error> = JavaScriptActor.assumeIsolated {
                  Result {
                    return try objectBuilder.build(appContext: appContext).asValue()
                  }
                }
                return try isolatedResult.get()
          """)

          # 6+7. DynamicConvertibleType.swift — directJSValueIfPossible (two identical sites)
          patch(f"{CORE}/Core/DynamicTypes/DynamicConvertibleType.swift",
          """      return try JavaScriptActor.assumeIsolated {
                  try value.toObject(appContext: appContext).asValue()
                }
          """,
          """      // v20: bypass the throwing assumeIsolated overload (Swift 6.2 dyld
                // symbol mismatch). Result captures the error so only the non-throwing
                // overload is referenced cross-module; the same error is rethrown.
                let isolatedResult: Result<JavaScriptValue, any Error> = JavaScriptActor.assumeIsolated {
                  Result {
                    try value.toObject(appContext: appContext).asValue()
                  }
                }
                return try isolatedResult.get()
          """, count=2)

          # Final guard: no throwing-overload call site may remain in expo-modules-core
          import subprocess
          out = subprocess.run(
              ["grep", "-rn", "try JavaScriptActor.assumeIsolated", "node_modules/expo-modules-core"],
              capture_output=True, text=True).stdout
          remaining = [l for l in out.splitlines() if "try JavaScriptActor.assumeIsolated" in l]
          assert not remaining, f"unpatched throwing call sites remain: {remaining}"
          print("v20 call-site bypass applied cleanly (7 sites)")
          EOF

      - name: Patch ExpoModulesJSI internal throwing call sites (v21)
        run: |
          python3 - <<'EOF'
          # v21: with the throwing assumeIsolated overload deleted, the 4 internal
          # throwing call sites in expo-modules-jsi must also bypass it (or they
          # become compile errors). do/catch captures the error so only the
          # non-throwing overload is referenced. Semantics unchanged: the same
          # error value is rethrown to the caller.

          def patch(path, old, new, count=1):
              src = open(path).read()
              found = src.count(old)
              assert found == count, f"{path}: expected {count}, found {found}"
              open(path, "w").write(src.replace(old, new))
              print(f"OK {path}")

          JSI = "node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/JavaScriptRuntime.swift"

          # 1+2. execute() fast paths (sync and async) — identical text, count=2
          patch(JSI,
          """      return try JavaScriptActor.assumeIsolated(closure)
          """,
          """      // v21: throwing assumeIsolated overload deleted (Swift 6.2 dyld symbol
                // mismatch). do/catch captures the error so only the non-throwing
                // overload is referenced; the same error is rethrown to the caller.
                let isolatedResult: Result<R, any Error> = JavaScriptActor.assumeIsolated { () -> Result<R, any Error> in
                  do {
                    return .success(try closure())
                  } catch {
                    return .failure(error)
                  }
                }
                return try isolatedResult.get()
          """, count=2)

          # 3. execute() scheduled path — result = .success(...)
          patch(JSI,
          """        result = .success(try JavaScriptActor.assumeIsolated(closure))
          """,
          """        // v21: throwing assumeIsolated overload deleted (Swift 6.2 dyld symbol
                  // mismatch). do/catch captures the error so only the non-throwing
                  // overload is referenced; the same error is rethrown to the caller.
                  let isolatedResult: Result<R, any Error> = JavaScriptActor.assumeIsolated { () -> Result<R, any Error> in
                    do {
                      return .success(try closure())
                    } catch {
                      return .failure(error)
                    }
                  }
                  result = .success(try isolatedResult.get())
          """)

          # 4. execute() async continuation — resume(returning:)
          patch(JSI,
          """          continuation.resume(returning: try JavaScriptActor.assumeIsolated(closure))
          """,
          """          // v21: throwing assumeIsolated overload deleted (Swift 6.2 dyld symbol
                    // mismatch). do/catch captures the error so only the non-throwing
                    // overload is referenced; the same error is rethrown to the caller.
                    let isolatedResult: Result<R, any Error> = JavaScriptActor.assumeIsolated { () -> Result<R, any Error> in
                      do {
                        return .success(try closure())
                      } catch {
                        return .failure(error)
                      }
                    }
                    continuation.resume(returning: try isolatedResult.get())
          """)

          # Final guard: no throwing-overload call site may remain in expo-modules-jsi
          import subprocess
          out = subprocess.run(
              ["grep", "-rn", "try JavaScriptActor.assumeIsolated", "node_modules/expo-modules-jsi/apple/Sources"],
              capture_output=True, text=True).stdout
          remaining = [l for l in out.splitlines()
                       if "try JavaScriptActor.assumeIsolated" in l and "/Tests/" not in l]
          assert not remaining, f"unpatched throwing call sites remain: {remaining}"
          print("v21 JSI bypass applied cleanly (4 sites)")
          EOF

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          ls /Applications/ | grep -i "^Xcode" || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode_2*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Prebuild ExpoModulesJSI xcframework (avoid race with client compile)
        run: |
          cd node_modules/expo-modules-jsi/apple
          PODS_ROOT="$GITHUB_WORKSPACE/ios/Pods" PLATFORM_NAME=iphoneos ./scripts/build-xcframework.sh
          grep -n "assumeIsolated" Products/ExpoModulesJSI.xcframework/ios-arm64/ExpoModulesJSI.framework/Modules/ExpoModulesJSI.swiftmodule/arm64-apple-ios.swiftinterface | head -5

      - name: Archive without code signing
        run: |
          set -e
          xcodebuild \
            -workspace ios/Opsflare.xcworkspace \
            -scheme Opsflare \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/derived \
            -archivePath build/Opsflare.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Verify no dangling throwing assumeIsolated reference (v20 gate)
        run: |
          set -e
          # The v20 bypass must leave zero cross-module references to the
          # throwing overload. Its mangling contains XEKRi_z (typed throws(E)
          # with the ~Copyable inverse constraint); the non-throwing overload
          # is fine and expected to appear.
          found=0
          while IFS= read -r bin; do
            if file -b "$bin" | grep -q "Mach-O"; then
              hits=$(nm -u "$bin" 2>/dev/null | grep "assumeIsolated" | grep "XEKRi_z" || true)
              if [ -n "$hits" ]; then
                echo "DANGLING throwing assumeIsolated in $bin:"
                echo "$hits"
                found=1
              else
                echo "clean: $bin"
              fi
            fi
          done < <(find build/Opsflare.xcarchive -type f \( -name "Opsflare" -o -name "ExpoModulesCore" \))
          if [ "$found" -ne 0 ]; then
            echo "FAIL: throwing assumeIsolated still referenced — app would crash at launch"
            exit 1
          fi
          echo "v20 gate passed: no throwing assumeIsolated references"

      - name: Dump swiftinterface (diagnostic)
        if: always()
        run: |
          SI=$(find node_modules/expo-modules-jsi/apple/Products/ExpoModulesJSI.xcframework -name "*.swiftinterface" | head -1)
          echo "interface: $SI"
          ls -l "$SI"
          grep -n "assumeIsolated" "$SI" | head -10

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="build/Opsflare.xcarchive/Products/Applications/Opsflare.app"
          test -d "$APP_PATH" || { echo "App bundle not found at $APP_PATH"; ls -R build/Opsflare.xcarchive/Products || true; exit 1; }
          rm -rf Payload Opsflare-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Opsflare-unsigned.ipa
          unzip -tq Opsflare-unsigned.ipa
          ls -lh Opsflare-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: opsflare-unsigned-ipa
          path: Opsflare-unsigned.ipa
          if-no-files-found: error

      - name: Publish GitHub Release with IPA
        run: |
          set -e
          TAG="unsigned-1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" -y --cleanup-tag || true
          fi
          gh release create "$TAG" Opsflare-unsigned.ipa \
            --title "Opsflare unsigned IPA" \
            --notes "Unsigned iOS build of Opsflare (no code signing). Sideload with AltStore / Sideloadly / TrollStore, which will re-sign it with your own Apple ID."
        env:
          GH_TOKEN: ${{ github.token }}
