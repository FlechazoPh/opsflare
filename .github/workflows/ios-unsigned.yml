name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-unsigned.yml'

permissions:
  contents: write

jobs:
  build-ios-unsigned:
    runs-on: macos-15
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Upgrade expo-modules-jsi (upstream Swift 6.2 fix in 57.0.8)
        run: npm install --no-save expo-modules-jsi@57.0.8

      - name: Patch expo-modules-jsi header for Xcode 26 clang
        run: |
          H="node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h"
          # 57.0.8 annotates C++ constructors with SWIFT_RETURNS_RETAINED, which
          # Xcode 26's clang rejects. Strip the annotation (restores 57.0.4 behavior).
          sed -i '' 's/SWIFT_RETURNS_RETAINED RuntimeScheduler(/RuntimeScheduler(/' "$H"
          grep -n "SWIFT_RETURNS_RETAINED" "$H" || echo "header patched clean"

      - name: Patch ExpoModulesJSI for Swift 6.2 (upstream UncheckedSendable fix)
        run: |
          python3 - <<'EOF'
          p = "node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/JavaScriptRuntime.swift"
          src = open(p).read()

          # 1. Add the UncheckedSendable wrapper before the first createFunctionClosure
          wrapper = (
            "/// Unchecked Sendable wrapper for call-scoped raw pointers captured by\n"
            "/// synchronously-executed closures. Mirrors the upstream fix for the\n"
            "/// Swift 6.2 compiler, which rejects `nonisolated(unsafe)` captures in\n"
            "/// global-actor-isolated closures.\n"
            "private struct UncheckedSendable<T>: @unchecked Sendable {\n"
            "  let value: T\n"
            "  init(_ value: T) { self.value = value }\n"
            "}\n"
            "\n"
          )
          assert "struct UncheckedSendable" not in src
          src = src.replace("private func createFunctionClosure(", wrapper + "private func createFunctionClosure(", 1)

          # 2. Swap nonisolated(unsafe) captures for UncheckedSendable (both overloads)
          old_lets = "\n".join([
            "    nonisolated(unsafe) let thisPtr = thisPtr",
            "    nonisolated(unsafe) let argumentsPtr = argumentsPtr",
            "    nonisolated(unsafe) let resultPtr = resultPtr",
          ])
          new_lets = "\n".join([
            "    let thisPtr = UncheckedSendable(thisPtr)",
            "    let argumentsPtr = UncheckedSendable(argumentsPtr)",
            "    let resultPtr = UncheckedSendable(resultPtr)",
          ])
          n = src.count(old_lets)
          assert n == 2, f"expected 2 capture blocks, found {n}"
          src = src.replace(old_lets, new_lets)

          # 3. Update use sites to go through .value
          # (leading \n anchors the 6-space indent: the 8-space HostObjectContext
          # site must stay untouched)
          reps = [
            ("\n      resultPtr.pointee = JavaScriptActor.assumeIsolated {", "\n      resultPtr.value.pointee = JavaScriptActor.assumeIsolated {"),
            ("UnsafeMutablePointer(mutating: thisPtr).move()", "UnsafeMutablePointer(mutating: thisPtr.value).move()"),
            ("start: argumentsPtr, count:", "start: argumentsPtr.value, count:"),
            ("JavaScriptUnownedValue(runtime.pointee, thisPtr)", "JavaScriptUnownedValue(runtime.pointee, thisPtr.value)"),
          ]
          for old, new in reps:
            c = src.count(old)
            assert c >= 1, f"pattern not found: {old}"
            src = src.replace(old, new)

          open(p, "w").write(src)
          print("patched OK")
          EOF

      - name: Patch JavaScriptActor for dyld (emit throwing assumeIsolated)
        run: |
          python3 - <<'EOF'
          p = "node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/JavaScriptActor.swift"
          src = open(p).read()

          # The throwing assumeIsolated overload is @_alwaysEmitIntoClient, so the
          # generic is never emitted in the framework binary — but Swift 6.2 fails
          # to emit it into clients (typed throws), leaving a dangling external
          # reference that kills the app at launch (dyld: Symbol not found).
          # Dropping the attribute makes it a normal public symbol that dyld can
          # resolve. Only the throwing overload is affected; the nonthrowing one
          # inlines into clients fine.
          #
          # ADDITIONALLY: Swift 6.2 mangles the library's inferred `E: Error`
          # requirement (from throws(E)) differently than the client's interface
          # reader does -> dyld mismatch. Using untyped `throws` (no generic E
          # at all) sidesteps the issue entirely. `@_disfavoredOverload` keeps
          # overload resolution unambiguous. All 7 client call sites just use
          # `try` without relying on the concrete error type, so this is safe.
          old = (
            "  /// Throwing counterpart to the nonthrowing overload above. The generic error type keeps\n"
            "  /// `operation` nonescaping while preserving the exact error it can throw.\n"
            "  @_alwaysEmitIntoClient\n"
            "  @inline(__always)\n"
            "  public static func assumeIsolated<T: ~Copyable, E: Error>(\n"
            "    _ operation: @JavaScriptActor () throws(E) -> T\n"
            "  ) throws(E) -> T {\n"
            "    // Casting a `throws(E)` function value requires newer OS runtime support. Wrapping the\n"
            "    // operation in the nonthrowing fast path keeps this backdeployable and stack-allocated.\n"
            "    let result: Result<T, E> = assumeIsolated {\n"
            "      return Result(catching: operation)\n"
            "    }\n"
            "    return try result.get()\n"
            "  }\n"
          )
          new = (
            "  /// Throwing counterpart to the nonthrowing overload above.\n"
            "  @_disfavoredOverload\n"
            "  @inline(__always)\n"
            "  public static func assumeIsolated<T>(\n"
            "    _ operation: @JavaScriptActor () throws -> T\n"
            "  ) throws -> T {\n"
            "    let result: Result<T, any Error> = assumeIsolated {\n"
            "      return Result(catching: operation)\n"
            "    }\n"
            "    return try result.get()\n"
            "  }\n"
          )
          assert src.count(old) == 1, "throwing assumeIsolated pattern not found"
          src = src.replace(old, new)
          open(p, "w").write(src)
          print("actor patched OK")
          EOF

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          ls /Applications/ | grep -i "^Xcode" || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode_2*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Archive without code signing
        run: |
          set -e
          xcodebuild \
            -workspace ios/Opsflare.xcworkspace \
            -scheme Opsflare \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/derived \
            -archivePath build/Opsflare.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Dump swiftinterface (diagnostic)
        if: always()
        run: |
          SI=$(find node_modules/expo-modules-jsi/apple/Products/ExpoModulesJSI.xcframework -name "*.swiftinterface" | head -1)
          echo "interface: $SI"
          ls -l "$SI"
          grep -n "assumeIsolated" "$SI" | head -10

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="build/Opsflare.xcarchive/Products/Applications/Opsflare.app"
          test -d "$APP_PATH" || { echo "App bundle not found at $APP_PATH"; ls -R build/Opsflare.xcarchive/Products || true; exit 1; }
          rm -rf Payload Opsflare-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Opsflare-unsigned.ipa
          unzip -tq Opsflare-unsigned.ipa
          ls -lh Opsflare-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: opsflare-unsigned-ipa
          path: Opsflare-unsigned.ipa
          if-no-files-found: error

      - name: Publish GitHub Release with IPA
        run: |
          set -e
          TAG="unsigned-1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" -y --cleanup-tag || true
          fi
          gh release create "$TAG" Opsflare-unsigned.ipa \
            --title "Opsflare unsigned IPA" \
            --notes "Unsigned iOS build of Opsflare (no code signing). Sideload with AltStore / Sideloadly / TrollStore, which will re-sign it with your own Apple ID."
        env:
          GH_TOKEN: ${{ github.token }}
